  <path d="M60 340 L10 490 L80 450z" fill="#e53e3e" stroke="#111" stroke-width="4"/>
  <rect x="200" y="215" width="40" height="80" rx="8" fill="#1a202c" stroke="#a0aec0" stroke-width="4" transform="rotate(10 220 255)"/>
