  <rect x="0" y="60" width="800" height="14" fill="#4a5568"/><rect x="0" y="90" width="800" height="14" fill="#4a5568"/>
  <rect x="520" y="130" width="230" height="170" rx="8" fill="#4a5568" stroke="#111" stroke-width="5"/>
  <text x="635" y="165" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">ROBOT-07 · RADIO</text>
  <circle cx="570" cy="215" r="14" fill="#e53e3e" stroke="#111" stroke-width="3"/>
