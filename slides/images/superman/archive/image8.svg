  <rect x="425" y="285" width="80" height="22" rx="10" fill="#cbd5e0" stroke="#111" stroke-width="5"/>
  <!-- hero speech -->
  <path d="M40 60 h250 a16 16 0 0 1 16 16 v90 a16 16 0 0 1 -16 16 h-150 l-50 40 v-40 h-50 a16 16 0 0 1 -16 -16 v-90 a16 16 0 0 1 16 -16z" fill="#fff" stroke="#111" stroke-width="5" transform="translate(0 40)"/>
  <text x="165" y="130" font-size="30" font-weight="bold" text-anchor="middle" fill="#111">« Je suis</text>
  <text x="165" y="170" font-size="30" font-weight="bold" text-anchor="middle" fill="#111">le boss ! »</text>
  <!-- hero -->
  <circle cx="95" cy="300" r="42" fill="#f6ad55" stroke="#111" stroke-width="5"/>
