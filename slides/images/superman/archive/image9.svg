  <rect x="30" y="330" width="170" height="100" rx="8" fill="#4a5568" stroke="#111" stroke-width="5"/>
  <rect x="50" y="270" width="110" height="60" rx="8" fill="#718096" stroke="#111" stroke-width="5"/>
  <text x="115" y="418" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">CANON</text>
  <!-- unplugged cable -->
  <path d="M120 270 q-20 -40 20 -60 q30 -10 25 -35" fill="none" stroke="#111" stroke-width="7"/>
  <rect x="152" y="150" width="26" height="30" rx="4" fill="#ecc94b" stroke="#111" stroke-width="3"/>
  <path d="M168 135 l8 -18 l-4 14 l12 -10 l-8 18z" fill="#ecc94b" stroke="#111" stroke-width="2"/>
  <!-- robot with crystal -->
  <rect x="270" y="290" width="90" height="130" rx="12" fill="#cbd5e0" stroke="#111" stroke-width="5"/>
  <rect x="285" y="215" width="60" height="70" rx="10" fill="#e2e8f0" stroke="#111" stroke-width="5"/>
  <circle cx="315" cy="245" r="15" fill="#e53e3e" stroke="#111" stroke-width="3"/>
  <polygon points="400,300 425,240 450,300 425,340" fill="#48bb78" stroke="#111" stroke-width="4"/>
  <polygon points="400,300 425,240 425,340" fill="#9ae6b4" opacity="0.6"/>
  <rect x="355" y="310" width="50" height="16" rx="8" fill="#cbd5e0" stroke="#111" stroke-width="4"/>
  <!-- rocket -->
  <g transform="translate(560 40)">
    <path d="M40 0 q40 50 40 120 h-80 q0 -70 40 -120z" fill="#e2e8f0" stroke="#111" stroke-width="5"/>
    <circle cx="40" cy="70" r="16" fill="#3182ce" stroke="#111" stroke-width="4"/>
    <polygon points="0,120 -25,170 0,150" fill="#e53e3e" stroke="#111" stroke-width="4"/>
    <polygon points="80,120 105,170 80,150" fill="#e53e3e" stroke="#111" stroke-width="4"/>
    <polygon points="40,125 62,200 40,180 18,200" fill="#f6ad55" stroke="#111" stroke-width="3"/>
    <polygon points="28,98 40,80 52,98 40,112" fill="#48bb78" stroke="#111" stroke-width="2"/>
  </g>
  <!-- laptop -->
  <rect x="440" y="370" width="170" height="90" rx="6" fill="#1a202c" stroke="#111" stroke-width="4"/>
  <text x="525" y="398" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">UPDATE v6.6.6</text>
  <rect x="460" y="408" width="130" height="14" fill="#2d3748"/><rect x="460" y="408" width="130" height="14" fill="#48bb78"/>
  <text x="525" y="445" font-size="14" font-weight="bold" text-anchor="middle" fill="#fc8181">⚠ unsigned</text>
  <!-- hero far right -->
  <circle cx="735" cy="350" r="22" fill="#f6ad55" stroke="#111" stroke-width="3"/>
  <path d="M713 345 q5 -24 44 -10 q-6 -10 -22 -12 q-25 0 -22 22z" fill="#1a202c"/>
  <rect x="712" y="372" width="46" height="60" rx="8" fill="#3182ce" stroke="#111" stroke-width="3"/>
  <path d="M712 375 L692 440 L718 425z" fill="#e53e3e" stroke="#111" stroke-width="3"/>
  <path d="M714 392 h42" stroke="#111" stroke-width="3"/>
</svg>
