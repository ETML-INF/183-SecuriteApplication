<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Comic Sans MS, Arial, sans-serif">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1026"/><stop offset="1" stop-color="#2b3a55"/></linearGradient></defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <g fill="#fff"><circle cx="560" cy="40" r="2"/><circle cx="640" cy="90" r="2"/><circle cx="720" cy="40" r="3"/><circle cx="500" cy="110" r="2"/><circle cx="690" cy="150" r="2"/><circle cx="610" cy="25" r="2"/></g>
  <rect y="430" width="800" height="70" fill="#1a202c"/>
