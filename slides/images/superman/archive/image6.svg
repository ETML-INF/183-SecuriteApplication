  <rect x="50" y="30" width="700" height="40" rx="10" fill="#4a5568"/>
  <text x="400" y="58" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">ROBOT-07 · MAINTENANCE CONSOLE</text>
